<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080619" />
    <meta name="description" content="A gentle space journey from Earth to the Moon and Mars, for young explorers." />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Space Ninja — Earth, Moon and Mars</title>

    <!-- Critical boot styling, inlined so the loading state paints before any JS or CSS loads. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #080619;
        color: #efe9ff;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.1rem;
        text-align: center;
        font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(120% 90% at 50% 30%, #1c1440 0%, #080619 70%);
        z-index: 50;
        transition: opacity 0.6s ease;
      }
      #boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-moon {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 32%, #fffdf6, #c9c2e6 55%, #6c63a0 100%);
        box-shadow: 0 0 46px rgba(184, 176, 255, 0.55);
        animation: bob 2.4s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        font-size: 1.15rem;
        letter-spacing: 0.02em;
        opacity: 0.85;
      }
      #boot .boot-error {
        display: none;
        max-width: 30ch;
        font-size: 1rem;
        line-height: 1.5;
        color: #ffd0d0;
      }
      #boot.has-error .boot-moon {
        animation: none;
        filter: grayscale(1);
        opacity: 0.4;
      }
      #boot.has-error .boot-error {
        display: block;
      }
      #boot.has-error .boot-status {
        display: none;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(-6px);
        }
        50% {
          transform: translateY(6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-moon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="A view of space with the Earth, the Moon and Mars"></canvas>

    <!-- Interface layer. Populated and controlled by src/ui/ui.ts. -->
    <div id="ui" class="ui" aria-live="polite"></div>

    <div id="boot" role="status">
      <div class="boot-moon" aria-hidden="true"></div>
      <p class="boot-status">Getting the stars ready…</p>
      <p class="boot-error">
        This little spaceship needs 3D graphics (WebGL) to fly, and this browser could not start
        them. Try a different browser, or check that hardware acceleration is switched on.
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
