name: Deploy to GitHub Pages

# Every pushed branch runs the full checks, so a branch can be shown green before it is
# merged; only main publishes. Merge to main only after the branch's run has passed.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# On main, let a running deploy finish rather than cancelling it; queued pushes just wait.
# A branch has its own queue, and a newer push to it replaces the older check.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the lockfile was generated with.
          node-version: 24
          cache: npm

      # Pages is already enabled on the repo with Actions as the build source, so this
      # only reads the existing config. Do not add enablement:true - the workflow token
      # is not permitted to create the site and the step hard-fails.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - run: npm ci

      # Both gates are intentionally in the deploy path: the unit tests pin interaction
      # invariants that a successful TypeScript compilation cannot see.
      - run: npm test

      # Rendered interaction checks use an isolated build; normal production has no test hook.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # `npm run build` type-checks first, so a type error fails the deploy too.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
