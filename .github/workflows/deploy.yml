name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; queued pushes just wait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the lockfile was generated with.
          node-version: 24
          cache: npm

      # Pages is already enabled on the repo with Actions as the build source, so this
      # only reads the existing config. Do not add enablement:true - the workflow token
      # is not permitted to create the site and the step hard-fails.
      - uses: actions/configure-pages@v5

      - run: npm ci

      # Both gates are intentionally in the deploy path: the unit tests pin interaction
      # invariants that a successful TypeScript compilation cannot see.
      - run: npm test

      # `npm run build` type-checks first, so a type error fails the deploy too.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
